<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
    <body>
    <div class="calculator">
        <p></p>
      <input type="text" id="display" readonly />

      <div class="btn">
        <button class="a" onclick="deleteLast()">X</button>
        <button class="a" onclick="clearDisplay()">AC</button>
        <button class="a" onclick="append('%')">%</button>
        <button class="b" onclick="append('/')">/</button>
        <button class="n" onclick="append('7')">7</button>
        <button class="n" onclick="append('8')">8</button>
        <button class="n" onclick="append('9')">9</button>
        <button class="b" onclick="append('*')">*</button>
        <button class="n" onclick="append('4')">4</button>
        <button class="n" onclick="append('5')">5</button>
        <button class="n" onclick="append('6')">6</button>
        <button class="b" onclick="append('-')">-</button>
        <button class="n" onclick="append('1')">1</button>
        <button class="n" onclick="append('2')">2</button>
        <button class="n" onclick="append('3')">3</button>
        <button class="b" onclick="append('+')">+</button>
        <button class="n" onclick="toggleSign()">+/-</button>
        <button class="n" onclick="append('0')">0</button>
        <button class="n" onclick="append('.')">.</button>
        <button class="b" onclick="calculateResult()">=</button>
      </div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
